<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page not found — Nodal Systems</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,600;10..72,700&family=Archivo:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  :root{
    --ground:#030303; --panel:#241B1B; --line:#523D3D;
    --ink:#F5F0EE; --muted:#C9B8B4; --faint:#92807C;
    --violet:#880FEB; --violet-bright:#A855F7; --crimson:#DF3158;
    --display:"Big Shoulders","Arial Narrow",sans-serif;
    --body:"Archivo","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono","Courier New",monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse 60% 50% at 50% 20%, rgba(136,15,235,.16), transparent 70%),
      radial-gradient(rgba(136,15,235,.10) 1px, transparent 1.6px),
      var(--ground);
    background-size:auto, 28px 28px, auto;
    color:var(--ink);
    font-family:var(--body);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    padding:24px;
  }
  .code{
    font-family:var(--mono); font-size:13px;
    letter-spacing:.18em; color:var(--faint);
    text-transform:uppercase;
    margin-bottom:18px;
  }
  h1{
    font-family:var(--display);
    font-size:clamp(56px, 12vw, 120px);
    font-weight:700; text-transform:uppercase;
    line-height:1;
    margin-bottom:18px;
  }
  h1 span{ color:var(--violet-bright); }
  p{ color:var(--muted); max-width:44ch; margin:0 auto 34px; }
  a.btn{
    font-family:var(--mono); font-size:14px;
    text-decoration:none;
    padding:14px 26px;
    background:var(--crimson); color:#FFF;
    border:1px solid var(--crimson);
    display:inline-block;
  }
  a.btn:hover{ background:#E85179; border-color:#E85179; }
</style>
</head>
<body>
<div>
  <p class="code">route: not-found · 404</p>
  <h1>No model<br><span>for that one.</span></h1>
  <p>The router checked the whole library — this page isn't on the drive.</p>
  <a class="btn" href="index.html">Back to home</a>
</div>
</body>
</html>
