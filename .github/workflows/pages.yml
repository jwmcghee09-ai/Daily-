name: Deploy Nodal Systems site to GitHub Pages

on:
  push:
    branches: [claude/nodal-systems-ai-servers-imyya4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nodal-systems
      - id: deployment
        uses: actions/deploy-pages@v4
